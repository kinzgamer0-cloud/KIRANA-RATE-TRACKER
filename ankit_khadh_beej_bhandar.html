<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ankit Khadh Beej Bhandar & Mahalakshmi Store</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#121212',
                        cardBg: '#1A1A1A',
                        cardHover: '#222222',
                        accentGreen: '#28C76F',
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#121212] text-gray-200 font-sans min-h-screen pb-24 selection:bg-[#28C76F]/30 flex flex-col">

    <div id="root" class="flex-1 flex flex-col">
        <div class="flex h-screen items-center justify-center">
            <p class="text-[#28C76F] animate-pulse font-bold text-lg">Loading Ankit Store...</p>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyATRUHIIGOKbAggh7kvRqRLjjcvzUMKDrA",
            authDomain: "rate-tracker-d1143.firebaseapp.com",
            projectId: "rate-tracker-d1143",
            storageBucket: "rate-tracker-d1143.firebasestorage.app",
            messagingSenderId: "1061139446887",
            appId: "1:1061139446887:web:1d2c033f6c744f2d7b28c2",
            measurementId: "G-EJLSMNBHL9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Make globally available for inline UI rendering
        window.firebaseApp = { auth, db, signInAnonymously, onAuthStateChanged, collection, onSnapshot, doc, setDoc, deleteDoc };
        
        // Trigger start rendering
        if (window.startApp) window.startApp();
    </script>

    <!-- React & Babel for In-Browser Rendering (Zero Setup Required) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const getSmartIcon = (name) => {
            if (!name) return '📦';
            const n = name.toLowerCase();
            if (/biscuit|cookie|parle|oreo|marie|good day|britannia/i.test(n)) return '🍪';
            if (/daal|dal|arhar|moong|masoor|urad|chana|pulse/i.test(n)) return '🫘'; 
            if (/chawal|rice|basmati|paddy/i.test(n)) return '🍚';
            if (/tel|oil|mustard|fortune|sunflower|refine|sarso/i.test(n)) return '🛢️';
            if (/aata|atta|maida|suji|wheat|flour|besan|sattu/i.test(n)) return '🌾';
            if (/sabun|surf|wash|detergent|rin|tide|wheel|soap|nirma/i.test(n)) return '🧼';
            if (/namkeen|chips|kurkure|lays|bhujia|mixture|haldiram/i.test(n)) return '🍟';
            if (/masala|haldi|mirch|dhaniya|spice|jeera|pepper|garam/i.test(n)) return '🌶️';
            if (/chini|salt|sugar|namak|gud|jaggery/i.test(n)) return '🧂';
            if (/tea|coffee|chai|patti|taj mahal|red label/i.test(n)) return '☕';
            if (/milk|paneer|dahi|ghee|butter|amul|sudha/i.test(n)) return '🥛';
            if (/seed|beej|khadh|fertilizer|urea|potash|khad|dap/i.test(n)) return '🌱';
            return '📦';
        };

        const INITIAL_BULK_UNITS = ['Carton', 'Bag', 'Tin', 'Box', 'Jar', 'Sack', 'Bundle', 'Peti', 'Bora'];
        const INITIAL_RETAIL_UNITS = ['Pkt', 'Pcs', 'Kg', 'Ltr', 'Gm', 'Ml', 'Bottle', 'Dozen'];

        function App() {
            const [user, setUser] = useState(null);
            const [authError, setAuthError] = useState(null);
            const [activeTab, setActiveTab] = useState('inventory'); // 'inventory', 'selling_price'
            const [searchQuery, setSearchQuery] = useState('');

            const [storeSettings, setStoreSettings] = useState({
                title: 'Ankit Khadh Beej Bhandar',
                subtitle: '& Mahalakshmi Store',
                location: 'Bibhutipur, Samastipur',
                bulkUnits: INITIAL_BULK_UNITS,
                retailUnits: INITIAL_RETAIL_UNITS
            });

            const [categories, setCategories] = useState([]);
            const [brands, setBrands] = useState([]);
            const [products, setProducts] = useState([]);

            const [activeCategoryId, setActiveCategoryId] = useState(null);
            const [activeBrandId, setActiveBrandId] = useState(null);
            const [expandedProducts, setExpandedProducts] = useState({});

            const [showModal, setShowModal] = useState(false);
            const [modalType, setModalType] = useState(''); // 'category', 'brand', 'product', 'editProduct'
            const [activeParentId, setActiveParentId] = useState(null);
            const [editingId, setEditingId] = useState(null);

            const [formData, setFormData] = useState({
                name: '', bulkType: 'Carton', unitType: 'Pkt', unitsPerBulk: 1,
                purchasePrice: '', sellingPrice: '', newSellingPrice: ''
            });

            const [deleteConfirm, setDeleteConfirm] = useState({ show: false, type: '', id: '', name: '' });

            useEffect(() => {
                const checkFirebase = () => {
                    if (window.firebaseApp) {
                        const { auth, signInAnonymously, onAuthStateChanged } = window.firebaseApp;
                        signInAnonymously(auth).catch(err => setAuthError(err.message));
                        onAuthStateChanged(auth, setUser);
                    } else {
                        setTimeout(checkFirebase, 500);
                    }
                };
                checkFirebase();
            }, []);

            useEffect(() => {
                if (!user || !window.firebaseApp) return;
                const { db, collection, onSnapshot, doc } = window.firebaseApp;

                const unsubSettings = onSnapshot(doc(db, 'store_data', 'settings'), (docSnap) => {
                    if (docSnap.exists()) setStoreSettings(docSnap.data());
                });

                const unsubCats = onSnapshot(collection(db, 'store_categories'), (snap) => {
                    setCategories(snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b)=>a.name.localeCompare(b.name)));
                });

                const unsubBrands = onSnapshot(collection(db, 'store_brands'), (snap) => {
                    setBrands(snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b)=>a.name.localeCompare(b.name)));
                });

                const unsubProducts = onSnapshot(collection(db, 'store_products'), (snap) => {
                    setProducts(snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b)=>a.name.localeCompare(b.name)));
                });

                return () => { unsubSettings(); unsubCats(); unsubBrands(); unsubProducts(); };
            }, [user]);

            const openModal = (type, parentId = null, itemToEdit = null) => {
                setModalType(type);
                setActiveParentId(parentId);
                if (itemToEdit) {
                    if (type === 'category' || type === 'brand') {
                        setFormData({ name: itemToEdit.name });
                    } else {
                        setFormData({
                            name: itemToEdit.name,
                            bulkType: itemToEdit.bulkType || storeSettings.bulkUnits[0],
                            unitType: itemToEdit.unitType || storeSettings.retailUnits[0],
                            unitsPerBulk: itemToEdit.unitsPerBulk || 1,
                            purchasePrice: itemToEdit.purchasePrice || '',
                            sellingPrice: itemToEdit.sellingPrice || '',
                            newSellingPrice: itemToEdit.newSellingPrice || ''
                        });
                    }
                    setEditingId(itemToEdit.id);
                } else {
                    setFormData({ name: '', bulkType: storeSettings.bulkUnits[0], unitType: storeSettings.retailUnits[0], unitsPerBulk: 1, purchasePrice: '', sellingPrice: '', newSellingPrice: '' });
                    setEditingId(null);
                }
                setShowModal(true);
            };

            const closeModal = () => setShowModal(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!formData.name.trim() || !user || !window.firebaseApp) return;

                const { db, doc, collection, setDoc } = window.firebaseApp;
                const docId = editingId || crypto.randomUUID();
                
                // INSTANT CLOSE MODAL TO PREVENT DOUBLE CLICK & FAST RESPONSIVENESS
                closeModal();

                if (modalType === 'category') {
                    await setDoc(doc(db, 'store_categories', docId), { name: formData.name });
                } else if (modalType === 'brand') {
                    await setDoc(doc(db, 'store_brands', docId), { name: formData.name, categoryId: activeParentId });
                } else if (modalType === 'product' || modalType === 'editProduct') {
                    const payload = {
                        name: formData.name,
                        bulkType: formData.bulkType,
                        unitType: formData.unitType,
                        unitsPerBulk: Number(formData.unitsPerBulk) || 1,
                        purchasePrice: Number(formData.purchasePrice) || 0,
                        sellingPrice: Number(formData.sellingPrice) || 0,
                        newSellingPrice: Number(formData.newSellingPrice) || 0,
                    };
                    if (!editingId) payload.brandId = activeParentId;
                    await setDoc(doc(db, 'store_products', docId), payload, { merge: true });
                }
            };

            const executeDelete = async () => {
                if (!user || !window.firebaseApp) return;
                const { db, doc, deleteDoc } = window.firebaseApp;
                const { type, id } = deleteConfirm;

                if (type === 'category') {
                    const bList = brands.filter(b => b.categoryId === id);
                    for (b of bList) {
                        const pList = products.filter(p => p.brandId === b.id);
                        for (p of pList) await deleteDoc(doc(db, 'store_products', p.id));
                        await deleteDoc(doc(db, 'store_brands', b.id));
                    }
                    await deleteDoc(doc(db, 'store_categories', id));
                    if (activeCategoryId === id) { setActiveCategoryId(null); setActiveBrandId(null); }
                } else if (type === 'brand') {
                    const pList = products.filter(p => p.brandId === id);
                    for (p of pList) await deleteDoc(doc(db, 'store_products', p.id));
                    await deleteDoc(doc(db, 'store_brands', id));
                    if (activeBrandId === id) setActiveBrandId(null);
                } else if (type === 'product') {
                    await deleteDoc(doc(db, 'store_products', id));
                }
                setDeleteConfirm({ show: false, type: '', id: '', name: '' });
            };

            const filteredProducts = useMemo(() => {
                if (!searchQuery) return products;
                const q = searchQuery.toLowerCase();
                return products.filter(p => p.name.toLowerCase().includes(q));
            }, [products, searchQuery]);

            if (authError) {
                return (
                    <div className="flex-1 flex items-center justify-center p-6 text-center">
                        <div className="bg-[#1A1A1A] p-6 rounded-2xl border border-red-500/30">
                            <h2 className="text-xl font-bold text-red-500 mb-2">Auth Error</h2>
                            <p className="text-gray-400 text-sm">{authError}</p>
                        </div>
                    </div>
                );
            }

            if (!user) {
                return (
                    <div className="flex-1 flex items-center justify-center">
                        <p className="text-[#28C76F] animate-pulse font-bold text-lg">Connecting Store...</p>
                    </div>
                );
            }

            return (
                <div className="flex-1 flex flex-col min-w-0">
                    {/* Header */}
                    <header className="bg-gradient-to-br from-[#1A3626] to-[#0D1F16] border-b border-[#28C76F]/20 text-white sticky top-0 z-30 shadow-md">
                        <div className="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center w-full">
                            <div>
                                <h1 className="text-xl font-black tracking-tight text-white leading-tight">{storeSettings.title}</h1>
                                <p className="text-xs text-[#28C76F] font-bold uppercase tracking-widest mt-0.5">{storeSettings.subtitle}</p>
                            </div>
                            <span className="flex items-center gap-1.5 px-2.5 py-1 bg-[#28C76F]/20 border border-[#28C76F]/40 rounded-full text-[10px] font-bold text-[#28C76F]">
                                <span className="w-1.5 h-1.5 bg-[#28C76F] rounded-full animate-pulse"></span> LIVE
                            </span>
                        </div>
                    </header>

                    <main className="p-4 max-w-4xl mx-auto w-full flex-1">
                        {/* Tabs */}
                        <div className="flex bg-[#1E1E1E] p-1.5 rounded-xl mb-6 shadow-sm border border-[#333]">
                            <button onClick={() => { setActiveTab('inventory'); setActiveCategoryId(null); setActiveBrandId(null); }} className={`flex-1 py-3 text-sm font-bold rounded-lg transition-all ${activeTab === 'inventory' ? 'bg-[#28C76F] text-black shadow-md' : 'text-gray-400 hover:text-white'}`}>
                                Inventory
                            </button>
                            <button onClick={() => setActiveTab('selling_price')} className={`flex-1 py-3 text-sm font-bold rounded-lg transition-all ${activeTab === 'selling_price' ? 'bg-[#28C76F] text-black shadow-md' : 'text-gray-400 hover:text-white'}`}>
                                Selling Prices
                            </button>
                        </div>

                        {activeTab === 'inventory' && (
                            <div className="space-y-6">
                                {/* LEVEL 1: CATEGORIES */}
                                {!activeCategoryId && (
                                    <>
                                        <div className="flex gap-4">
                                            <button onClick={() => openModal('category')} className="flex-1 bg-[#28C76F]/20 text-[#28C76F] border border-[#28C76F]/30 hover:bg-[#28C76F] hover:text-black py-3 rounded-xl flex items-center justify-center gap-2 text-sm font-bold transition-all">
                                                + Category
                                            </button>
                                        </div>

                                        {categories.length === 0 ? (
                                            <div className="text-center py-12 text-gray-500 bg-[#1A1A1A] rounded-2xl border border-[#333]">
                                                <p>Inventory is Empty. Add a Category.</p>
                                            </div>
                                        ) : (
                                            <div className="grid grid-cols-2 sm:grid-cols-3 gap-4">
                                                {categories.map(cat => {
                                                    const bCount = brands.filter(b => b.categoryId === cat.id).length;
                                                    return (
                                                        <div key={cat.id} onClick={() => setActiveCategoryId(cat.id)} className="bg-[#1A1A1A] border border-[#333] hover:border-[#28C76F]/50 rounded-2xl p-5 flex flex-col items-center justify-center text-center cursor-pointer transition-all hover:bg-[#222] shadow-sm relative group">
                                                            <div className="absolute top-2 right-2 flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                                                <button onClick={(e) => { e.stopPropagation(); setDeleteConfirm({ show: true, type: 'category', id: cat.id, name: cat.name }); }} className="p-1 text-red-400 hover:text-red-500 bg-[#333] rounded"><span className="text-xs">🗑️</span></button>
                                                            </div>
                                                            <div className="w-16 h-16 bg-[#252525] rounded-2xl flex items-center justify-center text-3xl mb-3 border border-[#333]">
                                                                {getSmartIcon(cat.name)}
                                                            </div>
                                                            <h3 className="font-bold text-white text-base truncate w-full uppercase">{cat.name}</h3>
                                                            <p className="text-xs text-gray-500 mt-1">{bCount} Brands</p>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        )}
                                    </>
                                )}

                                {/* LEVEL 2: BRANDS */}
                                {activeCategoryId && !activeBrandId && (
                                    <div>
                                        <div className="flex items-center gap-3 mb-6">
                                            <button onClick={() => setActiveCategoryId(null)} className="p-2.5 bg-[#2A2A2A] text-gray-300 rounded-xl hover:bg-[#333]">⬅</button>
                                            <h2 className="text-[#28C76F] font-bold text-lg uppercase truncate">{categories.find(c => c.id === activeCategoryId)?.name}</h2>
                                        </div>

                                        <div className="flex gap-4 mb-6">
                                            <button onClick={() => openModal('brand', activeCategoryId)} className="flex-1 bg-[#28C76F]/20 text-[#28C76F] border border-[#28C76F]/30 hover:bg-[#28C76F] hover:text-black py-3 rounded-xl flex items-center justify-center gap-2 text-sm font-bold transition-all">
                                                + Brand
                                            </button>
                                        </div>

                                        <div className="grid grid-cols-2 sm:grid-cols-3 gap-4">
                                            {brands.filter(b => b.categoryId === activeCategoryId).map(brand => {
                                                const pCount = products.filter(p => p.brandId === brand.id).length;
                                                return (
                                                    <div key={brand.id} onClick={() => setActiveBrandId(brand.id)} className="bg-[#1A1A1A] border border-[#333] hover:border-[#28C76F]/50 rounded-2xl p-5 flex flex-col items-center justify-center text-center cursor-pointer transition-all hover:bg-[#222] relative group">
                                                        <div className="absolute top-2 right-2 flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                                            <button onClick={(e) => { e.stopPropagation(); setDeleteConfirm({ show: true, type: 'brand', id: brand.id, name: brand.name }); }} className="p-1 text-red-400 bg-[#333] rounded">🗑️</button>
                                                        </div>
                                                        <h3 className="font-bold text-white text-base truncate w-full">{brand.name}</h3>
                                                        <p className="text-xs text-gray-500 mt-1">{pCount} Products</p>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                )}

                                {/* LEVEL 3: PRODUCTS */}
                                {activeBrandId && (
                                    <div>
                                        <div className="flex items-center gap-3 mb-6">
                                            <button onClick={() => setActiveBrandId(null)} className="p-2.5 bg-[#2A2A2A] text-gray-300 rounded-xl">⬅</button>
                                            <h2 className="text-[#28C76F] font-bold text-lg truncate">{brands.find(b => b.id === activeBrandId)?.name}</h2>
                                        </div>

                                        <div className="flex gap-4 mb-6">
                                            <button onClick={() => openModal('product', activeBrandId)} className="flex-1 bg-[#28C76F] text-black py-3 rounded-xl flex items-center justify-center gap-2 text-sm font-bold shadow-md">
                                                + Product Item
                                            </button>
                                        </div>

                                        <div className="space-y-3">
                                            {products.filter(p => p.brandId === activeBrandId).map(product => {
                                                const isExp = expandedProducts[product.id];
                                                const unitPurchase = (product.purchasePrice / product.unitsPerBulk).toFixed(2);
                                                const unitSelling = (product.sellingPrice / product.unitsPerBulk).toFixed(2);
                                                return (
                                                    <div key={product.id} className="bg-[#1A1A1A] rounded-xl border border-[#333] overflow-hidden">
                                                        <div className="p-4 flex justify-between items-center cursor-pointer" onClick={() => setExpandedProducts(prev => ({ ...prev, [product.id]: !isExp }))}>
                                                            <div className="flex items-center gap-3">
                                                                <span className="text-2xl">{getSmartIcon(product.name)}</span>
                                                                <div>
                                                                    <h3 className="font-bold text-white text-base">{product.name}</h3>
                                                                    <p className="text-xs text-gray-400">1 {product.bulkType} = {product.unitsPerBulk} {product.unitType}</p>
                                                                </div>
                                                            </div>
                                                            <div className="text-right flex items-center gap-3">
                                                                <div>
                                                                    <p className="text-sm font-bold text-white">₹{product.sellingPrice}</p>
                                                                    <p className="text-[10px] text-[#28C76F]">/{product.bulkType}</p>
                                                                </div>
                                                                <button onClick={(e) => { e.stopPropagation(); setDeleteConfirm({ show: true, type: 'product', id: product.id, name: product.name }); }} className="text-red-400 p-1">🗑️</button>
                                                            </div>
                                                        </div>

                                                        {isExp && (
                                                            <div className="p-4 bg-[#222] border-t border-[#333] grid grid-cols-2 gap-3">
                                                                <div className="bg-[#1A1A1A] p-3 rounded-lg border border-[#333]">
                                                                    <p className="text-[10px] text-gray-400 uppercase">Purchase Price</p>
                                                                    <p className="text-base font-bold text-white">₹{product.purchasePrice} <span className="text-xs text-gray-400">/{product.bulkType}</span></p>
                                                                    <p className="text-xs text-gray-300 mt-1">₹{unitPurchase} per {product.unitType}</p>
                                                                </div>
                                                                <div className="bg-[#1C3A2D] p-3 rounded-lg border border-[#28C76F]/30">
                                                                    <p className="text-[10px] text-[#28C76F] uppercase">Selling Price</p>
                                                                    <p className="text-base font-bold text-white">₹{product.sellingPrice} <span className="text-xs text-[#28C76F]">/{product.bulkType}</span></p>
                                                                    <p className="text-xs text-[#87F2B3] mt-1">₹{unitSelling} per {product.unitType}</p>
                                                                </div>
                                                                <div className="col-span-2 flex justify-end pt-2">
                                                                    <button onClick={() => openModal('editProduct', null, product)} className="px-3 py-1.5 bg-[#333] text-white text-xs font-bold rounded-lg">Edit Details</button>
                                                                </div>
                                                            </div>
                                                        )}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'selling_price' && (
                            <div className="space-y-4">
                                <input type="text" placeholder="Search products..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full px-4 py-3 bg-[#1A1A1A] border border-[#333] rounded-xl text-white text-sm focus:outline-none focus:border-[#28C76F]" />
                                <div className="space-y-3">
                                    {filteredProducts.map(product => (
                                        <div key={product.id} className="bg-[#1A1A1A] p-4 rounded-xl border border-[#333] flex justify-between items-center">
                                            <div className="flex items-center gap-3">
                                                <span className="text-2xl">{getSmartIcon(product.name)}</span>
                                                <div>
                                                    <h3 className="font-bold text-white">{product.name}</h3>
                                                    <p className="text-xs text-gray-400">1 {product.bulkType} = {product.unitsPerBulk} {product.unitType}</p>
                                                </div>
                                            </div>
                                            <div className="text-right">
                                                <p className="text-base font-bold text-[#28C76F]">₹{product.sellingPrice} <span className="text-xs text-gray-400">/{product.bulkType}</span></p>
                                                <p className="text-xs text-gray-300">₹{(product.sellingPrice/product.unitsPerBulk).toFixed(2)}/{product.unitType}</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* MODAL */}
                    {showModal && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-[#1A1A1A] rounded-2xl shadow-2xl w-full max-w-lg border border-[#333] p-5 space-y-4">
                                <div className="flex justify-between items-center border-b border-[#333] pb-3">
                                    <h3 className="font-bold text-white text-base">
                                        {modalType === 'category' && 'Add Category'}
                                        {modalType === 'brand' && 'Add Brand'}
                                        {(modalType === 'product' || modalType === 'editProduct') && 'Product & Rates'}
                                    </h3>
                                    <button onClick={closeModal} className="text-gray-400 hover:text-white">✕</button>
                                </div>

                                <form onSubmit={handleSubmit} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-gray-400 uppercase mb-1">Name</label>
                                        <input type="text" required autoFocus value={formData.name} onChange={(e) => setFormData({...formData, name: e.target.value})} className="w-full px-3 py-2.5 bg-[#121212] border border-[#444] rounded-lg text-white text-sm focus:outline-none focus:border-[#28C76F]" />
                                    </div>

                                    {(modalType === 'product' || modalType === 'editProduct') && (
                                        <>
                                            <div className="grid grid-cols-3 gap-2">
                                                <div>
                                                    <label className="block text-[10px] text-gray-400 mb-1">Bulk Unit</label>
                                                    <select value={formData.bulkType} onChange={(e) => setFormData({...formData, bulkType: e.target.value})} className="w-full px-2 py-2 bg-[#121212] border border-[#444] rounded text-xs text-white">
                                                        {storeSettings.bulkUnits.map(u => <option key={u} value={u}>{u}</option>)}
                                                    </select>
                                                </div>
                                                <div>
                                                    <label className="block text-[10px] text-gray-400 mb-1">Retail Unit</label>
                                                    <select value={formData.unitType} onChange={(e) => setFormData({...formData, unitType: e.target.value})} className="w-full px-2 py-2 bg-[#121212] border border-[#444] rounded text-xs text-white">
                                                        {storeSettings.retailUnits.map(u => <option key={u} value={u}>{u}</option>)}
                                                    </select>
                                                </div>
                                                <div>
                                                    <label className="block text-[10px] text-gray-400 mb-1">Qty per Bulk</label>
                                                    <input type="number" required min="1" value={formData.unitsPerBulk} onChange={(e) => setFormData({...formData, unitsPerBulk: e.target.value})} className="w-full px-2 py-2 bg-[#121212] border border-[#444] rounded text-xs text-white" />
                                                </div>
                                            </div>

                                            <div className="grid grid-cols-2 gap-3">
                                                <div>
                                                    <label className="block text-[10px] text-gray-400 mb-1">Purchase Price (₹)</label>
                                                    <input type="number" required min="0" step="0.01" value={formData.purchasePrice} onChange={(e) => setFormData({...formData, purchasePrice: e.target.value})} className="w-full px-3 py-2 bg-[#121212] border border-[#444] rounded text-sm text-white" />
                                                </div>
                                                <div>
                                                    <label className="block text-[10px] text-[#28C76F] mb-1">Selling Price (₹)</label>
                                                    <input type="number" required min="0" step="0.01" value={formData.sellingPrice} onChange={(e) => setFormData({...formData, sellingPrice: e.target.value})} className="w-full px-3 py-2 bg-[#1C3A2D] border border-[#28C76F]/50 rounded text-sm text-white" />
                                                </div>
                                            </div>
                                        </>
                                    )}

                                    <button type="submit" className="w-full py-3 bg-[#28C76F] text-black rounded-xl font-bold hover:bg-[#20A65A] transition-colors mt-2">
                                        Save & Close
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* DELETE CONFIRM */}
                    {deleteConfirm.show && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[60] p-4">
                            <div className="bg-[#1A1A1A] p-6 rounded-2xl border border-red-500/30 text-center max-w-sm w-full">
                                <h2 className="text-lg font-bold text-white mb-2">Delete "{deleteConfirm.name}"?</h2>
                                <p className="text-xs text-gray-400 mb-4">This will permanently delete this item.</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setDeleteConfirm({ show: false })} className="flex-1 py-2 bg-[#333] rounded-lg text-sm">Cancel</button>
                                    <button onClick={executeDelete} className="flex-1 py-2 bg-red-500 text-white rounded-lg text-sm font-bold">Delete</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        window.startApp = () => {
            ReactDOM.createRoot(document.getElementById('root')).render(<App />);
        };
    </script>
</body>
</html>
